# Baseline for every profile (profile values override). Passed to JMeter with -q first.
load_threads=8
load_batch=1000
oltp_rows=1000000
olap_customers=100000
olap_products=5000
olap_orders=2000000
# GridGain 8 cache templates (cluster/local/gridgain-config.xml): perf_txn_tpl = MVCC (real SQL transactions), perf_tpl = ATOMIC
oltp_template=perf_txn_tpl
olap_template=perf_tpl
ingest_template=perf_tpl
